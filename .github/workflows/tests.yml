name: Tests
on: [push, pull_request]

jobs:
    gofmt:
        name: gofmt
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-go@v5
              with:
                  go-version: 1.26.0
                  cache-dependency-path: scraper/go.sum
            - name: Check gofmt
              run: cd scraper && gofmt -l . && test -z "$(gofmt -l .)"

    go-tests:
        name: Go build, vet and tests (scraper)
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-go@v5
              with:
                  go-version: 1.26.0
                  cache-dependency-path: scraper/go.sum
            - name: Build, vet and test the scraper
              # Retry module download: proxy.golang.org occasionally returns
              # INTERNAL_ERROR stream resets that abort an otherwise-green PR.
              run: |
                  set -euo pipefail
                  cd scraper
                  for attempt in 1 2 3; do
                    if go mod download; then
                      break
                    fi
                    if [ "$attempt" -eq 3 ]; then
                      exit 1
                    fi
                    sleep $((attempt * 5))
                  done
                  go build ./... && go vet ./... && go test ./...

    prettier:
        name: Prettier
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v2
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-prettier
                  restore-keys: |
                      ${{ runner.os }}-npm-
            - run: npm install -g prettier@3.5.3
            - run: |-
                  prettier --check .

    tests:
        name: Check Types and Run Tests
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v2
            - name: un-tar the staging www at the root of the repo
              run: curl -L https://instances.vantagestaging.sh/www_pre_build.tar.gz | tar -xzf -
            - uses: actions/setup-node@v4
              with:
                  node-version-file: next/.nvmrc
            - name: Initialize the test environment
              run: cd next && npm ci && npm run init
            - name: Check types
              run: cd next && npm run check-types
            - name: Run unit tests
              run: cd next && npm run test -- --coverage
